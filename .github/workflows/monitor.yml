
name: Chrome Hearts Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check website for new links
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Save detected links
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_products.json
          git diff --cached --quiet || git commit -m "Update monitored links"
          git push

      - name: Notify if monitoring fails
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            -H "Title: Chrome Hearts 감시 실행 실패" \
            -H "Priority: high" \
            -H "Tags: warning" \
            -d "감시 작업에 오류가 발생했습니다. GitHub Actions 실행 로그를 확인하세요." \
            "https://ntfy.sh/${NTFY_TOPIC}"
